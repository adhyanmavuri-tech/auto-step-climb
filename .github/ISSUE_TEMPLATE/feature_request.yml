name: Feature request
description: Something you would like it to do
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like it to do?
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - Another aircraft
        - Step climbs and the plan
        - BeyondATC or other ATC
        - The window or the tray icon
        - Installing and updating
        - Something else
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: For another aircraft, say which one and how its autopilot is set (knob, key events, LVars).
